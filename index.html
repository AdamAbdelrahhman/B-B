<style>
:root{
  --espresso:#2B1D18; --coffee:#6F4934; --cream:#F5EFE6; --caramel:#C58A52; --sage:#7B8067;
  --navy:#1B2530;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Manrope',sans-serif;background:var(--cream);color:var(--espresso);overflow-x:hidden}
html[dir="ltr"] body{font-family:'Manrope','Cairo',sans-serif}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,92%);margin-inline:auto}
section{padding:96px 0}

/* ---------- Header ---------- */
header{position:fixed;top:0;inset-inline:0;z-index:100;transition:.35s;padding:14px 0}
header.scrolled{background:rgba(27,37,48,.94);backdrop-filter:blur(14px);box-shadow:0 4px 24px rgba(0,0,0,.25);padding:8px 0}
header.on-hero:not(.scrolled){color:var(--cream)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.logo b{font-weight:900;font-size:1.15rem;letter-spacing:.5px}
.nav-links{display:flex;gap:26px;list-style:none;font-weight:600}
.nav-links a{position:relative;padding:4px 0;opacity:.85;transition:.25s}
.nav-links a:hover{opacity:1;color:var(--caramel)}
.nav-links a::after{content:"";position:absolute;bottom:0;inset-inline-start:0;width:0;height:2px;background:var(--caramel);border-radius:2px;transition:.3s}
.nav-links a:hover::after{width:100%}
.nav-cta{display:flex;align-items:center;gap:12px}
.lang-btn{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;font-family:inherit;font-weight:700;cursor:pointer;font-size:.85rem;transition:.25s}
.lang-btn:hover{background:var(--caramel);border-color:var(--caramel);color:#fff}
.burger{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:6px}
.burger span{width:26px;height:2.5px;background:currentColor;border-radius:2px;transition:.3s}
.burger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}

.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(197,138,82,.18);border:1px solid rgba(197,138,82,.5);color:var(--caramel);padding:7px 16px;border-radius:999px;font-weight:700;font-size:.85rem}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem);font-weight:900;line-height:1.15;margin:22px 0 18px}
.hero h1 em{color:var(--caramel);font-style:normal}
.hero p{font-size:1.15rem;opacity:.85;max-width:480px;line-height:1.9;margin-bottom:32px}
.hero-btns{display:flex;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 32px;border-radius:999px;font-weight:800;font-size:1rem;transition:.3s;border:2px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--caramel);color:#fff;box-shadow:0 10px 30px rgba(197,138,82,.4)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(197,138,82,.5)}
.btn-outline{border-color:rgba(245,239,230,.6);color:var(--cream)}
.btn-outline:hover{background:var(--cream);color:var(--espresso);transform:translateY(-3px)}
.hero-card{background:rgba(245,239,230,.08);border:1px solid rgba(245,239,230,.22);backdrop-filter:blur(14px);border-radius:26px;padding:22px}
.hero-card img{border-radius:18px;height:340px;width:100%;object-fit:cover}
.hero-stats{display:flex;gap:22px;margin-top:20px}
.stat b{font-size:1.35rem;color:var(--caramel)}
.stat small{opacity:.75;display:block}
.scroll-hint{position:absolute;bottom:26px;inset-inline-start:50%;transform:translateX(50%);opacity:.7;animation:float 2.2s ease-in-out infinite;font-size:1.4rem}
@keyframes float{0%,100%{transform:translate(50%,0)}50%{transform:translate(50%,10px)}}

/* ---------- Section headers ---------- */
.sec-head{text-align:center;max-width:640px;margin:0 auto 56px}
.sec-head .eyebrow{color:var(--coffee);background:rgba(111,73,52,.1);border-color:rgba(111,73,52,.3)}
.sec-head h2{font-size:clamp(1.9rem,4vw,2.8rem);font-weight:900;margin:16px 0 12px;color:var(--coffee)}
.sec-head p{opacity:.7;line-height:1.9}

/* ---------- Menu ---------- */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 34px rgba(43,29,24,.09);transition:.35s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-8px);box-shadow:0 22px 46px rgba(43,29,24,.16)}
.card-img{position:relative;overflow:hidden}
.card-img img{height:220px;width:100%;object-fit:cover;transition:.6s}
.card:hover .card-img img{transform:scale(1.07)}
.card-tag{position:absolute;top:14px;inset-inline-start:14px;background:var(--caramel);color:#fff;font-size:.75rem;font-weight:800;padding:5px 13px;border-radius:999px}
.card-body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-body h3{font-size:1.2rem;color:var(--coffee)}
.card-body p{opacity:.72;line-height:1.8;font-size:.93rem;flex:1}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.price{font-weight:900;font-size:1.05rem;color:var(--espresso)}
.price small{font-weight:600;opacity:.6;font-size:.78rem}
.card-foot a{font-weight:800;color:var(--caramel);font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.menu-note{text-align:center;opacity:.6;margin-top:26px;font-size:.9rem}
.menu-full{display:flex;justify-content:center;margin-top:28px}

/* ---------- Atmosphere ---------- */
.atmos{background:var(--navy);color:var(--cream)}
.atmos .sec-head h2{color:var(--cream)}
.atmos .sec-head p{opacity:.75}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px;gap:16px}
.g-item{border-radius:16px;overflow:hidden;position:relative;cursor:pointer}
.g-item img{width:100%;height:100%;object-fit:cover;transition:.6s}
.g-item:hover img{transform:scale(1.08)}
.g-item::after{content:attr(data-label);position:absolute;inset:auto 0 0 0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(27,37,48,.85));font-weight:700;font-size:.9rem;opacity:0;transition:.35s}
.g-item:hover::after{opacity:1}
.g-wide{grid-column:span 2;grid-row:span 2}
.g-tall{grid-row:span 2}

/* ---------- Reviews ---------- */
.reviews-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:start}
.rating-box{background:#fff;border-radius:var(--radius);padding:40px;text-align:center;box-shadow:0 10px 34px rgba(43,29,24,.09);position:sticky;top:110px}
.big-score{font-size:4.4rem;font-weight:900;color:var(--caramel);line-height:1}
.stars{color:var(--caramel);font-size:1.5rem;letter-spacing:4px;margin:10px 0}
.rating-box p{opacity:.7}
.review-list{display:flex;flex-direction:column;gap:20px}
.review{background:#fff;border-radius:var(--radius);padding:24px 26px;box-shadow:0 8px 26px rgba(43,29,24,.07);border-inline-start:4px solid var(--caramel)}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.review-head b{color:var(--coffee)}
.review-head span{color:var(--caramel)}
.review p{opacity:.75;line-height:1.9;font-size:.95rem}

/* ---------- Visit ---------- */
.visit-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:stretch}
.visit-info{background:var(--coffee);color:var(--cream);border-radius:var(--radius);padding:40px;display:flex;flex-direction:column;gap:24px}
.visit-info h3{font-size:1.6rem;font-weight:900}
.info-row{display:flex;gap:16px;align-items:flex-start}
.info-row .ic{width:46px;height:46px;flex:0 0 46px;background:rgba(245,239,230,.12);border-radius:12px;display:grid;place-items:center;font-size:1.2rem}
.info-row b{display:block;margin-bottom:3px}
.info-row p,.info-row a{opacity:.8;line-height:1.7}
.info-row a:hover{color:var(--caramel)}
.visit-btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto}
.btn-cream{background:var(--cream);color:var(--espresso)}
.btn-cream:hover{background:#fff;transform:translateY(-3px)}
.btn-ghost{border-color:rgba(245,239,230,.5);color:var(--cream)}
.btn-ghost:hover{background:var(--cream);color:var(--espresso)}
.map-wrap{border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 34px rgba(43,29,24,.12);min-height:420px}
.map-wrap iframe{width:100%;height:100%;min-height:420px;border:0}
.banner{border-radius:var(--radius);overflow:hidden;margin-top:40px;box-shadow:0 10px 34px rgba(43,29,24,.12)}
.banner img{width:100%;max-height:300px;object-fit:cover}

/* ---------- Footer ---------- */
footer{background:var(--navy);color:var(--cream);padding:56px 0 26px}
.foot-grid{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:36px}
.foot-grid p{opacity:.7;margin-top:10px;max-width:320px;line-height:1.8}
.foot-grid h4{color:var(--caramel);margin-bottom:14px;font-size:1.05rem}
.foot-grid ul{list-style:none;display:flex;flex-direction:column;gap:10px;opacity:.8}
.foot-grid ul a:hover{color:var(--caramel)}
.foot-logo{display:flex;align-items:center;gap:10px}
.foot-logo img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.foot-bottom{border-top:1px solid rgba(245,239,230,.15);padding-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:.85rem;opacity:.6}

/* ---------- Animations ---------- */
.reveal{opacity:0;transform:translateY(36px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}

/* ---------- Responsive ---------- */
@media(max-width:920px){
  .hero-grid,.reviews-grid,.visit-grid{grid-template-columns:1fr}
  .hero-card{max-width:480px}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .rating-box{position:static}
}
@media(max-width:680px){
  section{padding:70px 0}
  .nav-links{position:fixed;inset:0;background:var(--navy);flex-direction:column;align-items:center;justify-content:center;gap:34px;font-size:1.4rem;transform:translateY(-100%);transition:.45s;color:var(--cream)}
  .nav-links.open{transform:none}
  .burger{display:flex;z-index:110}
  .g-wide{grid-column:span 2}
}

let lang = 'ar';
const htmlEl = document.documentElement;

function setLang(l){
  lang = l;
  htmlEl.lang = l;
  htmlEl.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = l === 'ar' ? 'EN' : 'ع';
  document.title = l === 'ar' ? 'Beans&Brew — لحظة قهوة أفضل' : 'Beans&Brew — A Better Coffee Moment';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(T[l][k] !== undefined) el.innerHTML = T[l][k];
  });
  document.querySelectorAll('[data-label-key]').forEach(el=>{
    el.setAttribute('data-label', T[l][el.dataset.labelKey] || '');
  });
  try{ localStorage.setItem('bb-lang', l); }catch(e){}
}

const saved = (()=>{ try{ return localStorage.getItem('bb-lang'); }catch(e){ return null; } })();
setLang(saved === 'en' ? 'en' : 'ar');

document.getElementById('langBtn').addEventListener('click', ()=> setLang(lang === 'ar' ? 'en' : 'ar'));

/* Header on scroll */
const header = document.getElementById('header');
addEventListener('scroll', ()=>{
  header.classList.toggle('scrolled', scrollY > 60);
});

/* Mobile nav */
const burger = document.getElementById('burger');
const navLinks = document.getElementById('navLinks');
burger.addEventListener('click', ()=>{
  burger.classList.toggle('open');
  navLinks.classList.toggle('open');
});
navLinks.querySelectorAll('a').forEach(a=> a.addEventListener('click', ()=>{
  burger.classList.remove('open'); navLinks.classList.remove('open');
}));

/* Reveal animations */
const io = new IntersectionObserver(entries=>{
  entries.forEach((e)=>{
    if(e.isIntersecting){ setTimeout(()=> e.target.classList.add('visible'), (e.target.dataset.d||0)*80); io.unobserve(e.target); }
  });
},{threshold:.12});
document.querySelectorAll('.reveal').forEach((el,i)=>{ el.dataset.d = i % 3; io.observe(el); });
</script>
